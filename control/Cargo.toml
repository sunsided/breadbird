[package]
name = "breadbird-control"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "Controller design and plant identification glue for one quadrotor attitude axis, on top of minikalman and miniident"
authors = ["Markus Mayer"]
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
minikalman = { version = "0.9.1", default-features = false, features = ["libm"] }
libm = "0.2"

[dev-dependencies]
miniident = { version = "0.1.0-alpha.2", default-features = false, features = ["std"] }
minikalman = { version = "0.9.1", default-features = false, features = ["std"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"
mod_module_files = "deny"
float_cmp = "warn"
as_conversions = "warn"
